<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Beans vs Ghost</title><style>body{margin:0;background:#17142c;color:white;font-family:system-ui;text-align:center;touch-action:none}h1{font-size:clamp(25px,6vw,45px);margin:12px 0 0;color:#ffcb45;text-shadow:3px 3px #bd2952}p{margin:5px}canvas{width:min(96vw,780px);height:auto;border:5px solid #f4b843;border-radius:18px;background:#f6dfb7;touch-action:none}button{background:#ffcb45;border:0;border-radius:14px;padding:13px 20px;font-weight:900;font-size:18px;margin:6px;touch-action:none}#pad{display:grid;grid-template-columns:repeat(3,64px);justify-content:center;gap:4px;margin:8px}#pad button{margin:0;padding:12px}#status{font-size:19px;font-weight:800;min-height:30px}</style></head><body><h1>🐾 BEANS VS. GHOST 👻</h1><p>THE CHAOS CHRONICLES · Level 1: The Great Treat Heist</p><div id="status">Collect 5 treats! Avoid Ghost and the vacuum!</div><canvas id="game" width="780" height="460"></canvas><div><button id="start">▶ START / RESTART</button><button id="switch">🐶 Play as Beans</button></div><div id="pad"><span></span><button data-dir="up">▲</button><span></span><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><p>Use arrow keys / WASD or the touch controls. Switch dogs for a different challenge!</p><script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),status=document.getElementById('status');let keys=new Set(),role='beans',running=false,won=false,score=0,chaos=0,frame=0;let player={x:90,y:220},enemy={x:640,y:220},vac={x:390,y:200},treats=[];const rand=(a,b)=>a+Math.random()*(b-a);function reset(){player={x:90,y:220};enemy={x:640,y:220};vac={x:390,y:200};score=0;chaos=0;frame=0;won=false;running=true;treats=Array.from({length:5},()=>({x:rand(45,735),y:rand(70,420),got:false}));status.textContent=role==='beans'?'Beans: steal all 5 treats! 🦴':'Ghost: catch Beans 5 times! 🐭'}document.getElementById('start').onclick=reset;document.getElementById('switch').onclick=()=>{role=role==='beans'?'ghost':'beans';document.getElementById('switch').textContent=role==='beans'?'🐶 Play as Beans':'👻 Play as Ghost';reset()};document.querySelectorAll('[data-dir]').forEach(b=>{const k=b.dataset.dir;b.onpointerdown=e=>{e.preventDefault();keys.add(k);b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=()=>keys.delete(k)});onkeydown=e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys.add(k)};onkeyup=e=>keys.delete(e.key.toLowerCase());function move(p,dx,dy,s){let l=Math.hypot(dx,dy)||1;p.x=Math.max(25,Math.min(755,p.x+dx/l*s));p.y=Math.max(60,Math.min(435,p.y+dy/l*s))}function dog(x,y,which){ctx.save();ctx.translate(x,y);ctx.fillStyle=which==='beans'?'#756258':'#d9a55e';ctx.beginPath();ctx.ellipse(0,0,25,25,0,0,7);ctx.fill();ctx.fillStyle=which==='beans'?'#4a3a37':'#c38a43';for(let s of [-1,1]){ctx.beginPath();ctx.ellipse(s*21,-22,10,22,s*.35,0,7);ctx.fill()}ctx.fillStyle=which==='beans'?'#d6343b':'#263f68';ctx.fillRect(-18,12,36,12);ctx.fillStyle='white';ctx.beginPath();ctx.arc(-9,-4,5,0,7);ctx.arc(9,-4,5,0,7);ctx.fill();ctx.fillStyle='#201b20';ctx.beginPath();ctx.arc(-9,-4,2.5,0,7);ctx.arc(9,-4,2.5,0,7);ctx.arc(0,8,5,0,7);ctx.fill();ctx.restore()}function loop(){requestAnimationFrame(loop);ctx.clearRect(0,0,780,460);ctx.fillStyle='#e9c795';ctx.fillRect(0,0,780,460);ctx.fillStyle='#ad6b4e';ctx.fillRect(0,0,780,40);ctx.fillStyle='#b97e56';ctx.fillRect(0,420,780,40);ctx.fillStyle='#d6a66d';ctx.fillRect(290,110,190,110);ctx.fillStyle='#956c50';ctx.fillRect(315,135,140,60);ctx.fillStyle='#ffdf6c';ctx.font='26px system-ui';ctx.fillText('KITCHEN',320,34);ctx.font='30px system-ui';ctx.fillText('🛋️',40,100);ctx.fillText('🪴',705,100);ctx.fillText('🧸',680,390);if(running&&!won){frame++;let dx=(keys.has('right')||keys.has('arrowright')||keys.has('d')?1:0)-(keys.has('left')||keys.has('arrowleft')||keys.has('a')?1:0),dy=(keys.has('down')||keys.has('arrowdown')||keys.has('s')?1:0)-(keys.has('up')||keys.has('arrowup')||keys.has('w')?1:0);if(dx||dy)move(player,dx,dy,3.6);let chase=role==='beans'?player:player;move(enemy,chase.x-enemy.x,chase.y-enemy.y,role==='beans'?1.25:1.8);vac.x=390+145*Math.sin(frame/75);vac.y=280+65*Math.cos(frame/95);if(role==='beans'){for(const t of treats){if(!t.got&&Math.hypot(player.x-t.x,player.y-t.y)<29){t.got=true;score++;chaos+=20}}if(Math.hypot(player.x-enemy.x,player.y-enemy.y)<32||Math.hypot(player.x-vac.x,player.y-vac.y)<32){player.x=90;player.y=220;chaos=Math.max(0,chaos-10)}if(score===5){won=true;status.textContent='🏆 BEANS WINS! THE TREATS ARE GONE!'}}else{if(Math.hypot(player.x-enemy.x,player.y-enemy.y)<35){score++;enemy.x=rand(100,700);enemy.y=rand(80,400)}if(Math.hypot(player.x-vac.x,player.y-vac.y)<30){player.x=90;player.y=220}if(score>=5){won=true;status.textContent='🏆 GHOST WINS! PEACE RESTORED!'}}if(!won)status.textContent=(role==='beans'?'🦴 Treats: ':'🐭 Beans caught: ')+score+'/5  ·  ⚡ Chaos: '+chaos}for(const t of treats){if(!t.got){ctx.font='29px system-ui';ctx.fillText('🦴',t.x-15,t.y+10)}}ctx.font='36px system-ui';ctx.fillText('🧹',vac.x-19,vac.y+12);dog(player.x,player.y,role);dog(enemy.x,enemy.y,role==='beans'?'ghost':'beans');ctx.fillStyle='#3b2545';ctx.font='bold 14px system-ui';ctx.fillText(role==='beans'?'BEANS':'GHOST',player.x-24,player.y-37);ctx.fillText(role==='beans'?'GHOST':'BEANS',enemy.x-24,enemy.y-37);if(!running){ctx.fillStyle='#211b38d9';ctx.fillRect(145,150,490,150);ctx.fillStyle='white';ctx.font='bold 32px system-ui';ctx.fillText('🐾 READY FOR CHAOS?',200,210);ctx.font='19px system-ui';ctx.fillText('Tap START to play!',305,253)}}loop();
</script></body></html>
